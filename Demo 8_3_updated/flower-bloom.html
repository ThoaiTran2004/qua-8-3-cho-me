<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💐 Bó Hoa 8/3 Từ Con 💐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            z-index: 10;
            position: relative;
            max-width: 800px;
            width: 90%;
        }

        .title {
            color: white;
            font-size: 3em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            opacity: 0;
            animation: fadeIn 2s ease-in 1s forwards;
        }

        .message {
            color: white;
            font-size: 1.5em;
            margin-bottom: 40px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            opacity: 0;
            animation: fadeIn 2s ease-in 2s forwards;
            line-height: 1.6;
        }

        .flower-bouquet {
            position: relative;
            width: 400px;
            height: 400px;
            margin: 0 auto 40px;
        }

        .branch {
            position: absolute;
            width: 2px;
            background: linear-gradient(to bottom, #4a5f3a, #2d3a1f);
            transform-origin: bottom center;
            opacity: 0;
            animation: growBranch 2s ease-out forwards;
        }

        .flower {
            position: absolute;
            font-size: 40px;
            opacity: 0;
            transform: scale(0) rotate(0deg);
            animation: bloomFlower 1.5s ease-out forwards;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .flower:hover {
            transform: scale(1.2) rotate(10deg);
        }

        .flower.center {
            animation-delay: 3s;
        }

        .flower.top-left {
            animation-delay: 3.3s;
        }

        .flower.top-right {
            animation-delay: 3.6s;
        }

        .flower.left {
            animation-delay: 3.9s;
        }

        .flower.right {
            animation-delay: 4.2s;
        }

        .flower.bottom-left {
            animation-delay: 4.5s;
        }

        .flower.bottom-right {
            animation-delay: 4.8s;
        }

        @keyframes growBranch {
            0% {
                height: 0;
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                height: 150px;
                opacity: 0.8;
            }
        }

        @keyframes bloomFlower {
            0% {
                opacity: 0;
                transform: scale(0) rotate(0deg);
            }
            50% {
                opacity: 1;
                transform: scale(1.3) rotate(180deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes gatherBouquet {
            0% {
                transform: scale(1) rotate(0deg);
            }
            50% {
                transform: scale(0.8) rotate(5deg);
            }
            100% {
                transform: scale(0.9) rotate(-2deg);
            }
        }

        .bouquet-gathered {
            animation: gatherBouquet 2s ease-in-out 6s forwards;
        }

        .photo-frame {
            width: 250px;
            height: 250px;
            margin: 20px auto;
            border: 8px solid white;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            opacity: 0;
            animation: photoAppear 2s ease-in 7s forwards;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes photoAppear {
            from {
                opacity: 0;
                transform: scale(0.5) rotate(-180deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .final-message {
            color: white;
            font-size: 1.8em;
            margin-top: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            opacity: 0;
            animation: fadeIn 2s ease-in 8s forwards;
            line-height: 1.6;
        }

        .signature {
            color: #ffd700;
            font-style: italic;
            margin-top: 20px;
            font-size: 1.3em;
            opacity: 0;
            animation: fadeIn 2s ease-in 9s forwards;
        }

        .music-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
        }

        .music-btn {
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        .music-btn:hover {
            transform: scale(1.1);
            background: white;
        }

        .floating-hearts {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .heart {
            position: absolute;
            color: rgba(255, 105, 180, 0.7);
            font-size: 20px;
            animation: floatHeart 4s ease-in-out infinite;
        }

        @keyframes floatHeart {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .sparkle {
            position: absolute;
            color: gold;
            font-size: 16px;
            animation: sparkle 2s linear infinite;
            pointer-events: none;
        }

        @keyframes sparkle {
            0%, 100% {
                opacity: 0;
                transform: scale(0);
            }
            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .petal {
            position: absolute;
            width: 20px;
            height: 20px;
            background: linear-gradient(45deg, #ff69b4, #ffb6c1);
            border-radius: 0 50% 50% 50%;
            opacity: 0;
            animation: fallPetal 8s linear infinite;
        }

        @keyframes fallPetal {
            0% {
                opacity: 0;
                transform: translateY(-100px) rotate(0deg);
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(100vh) rotate(720deg);
            }
        }
    </style>
</head>
<body>
    <div class="floating-hearts" id="heartsContainer"></div>
    
    <div class="container">
        <h1 class="title">💐 Bó Hoa 8/3 Đặc Biệt 💐</h1>
        
        <div class="message">
            Mẹ yêu! Con gửi mẹ một bó hoa ảo diệu,<br>
            được tạo nên từ tình yêu thương vô bờ...
        </div>
        
        <div class="flower-bouquet" id="bouquet">
            <!-- Các nhánh hoa -->
            <div class="branch" style="bottom: 50%; left: 50%; transform: translateX(-50%) rotate(0deg);"></div>
            <div class="branch" style="bottom: 50%; left: 50%; transform: translateX(-50%) rotate(-30deg);"></div>
            <div class="branch" style="bottom: 50%; left: 50%; transform: translateX(-50%) rotate(30deg);"></div>
            <div class="branch" style="bottom: 50%; left: 50%; transform: translateX(-50%) rotate(-60deg);"></div>
            <div class="branch" style="bottom: 50%; left: 50%; transform: translateX(-50%) rotate(60deg);"></div>
            <div class="branch" style="bottom: 50%; left: 50%; transform: translateX(-50%) rotate(-90deg);"></div>
            <div class="branch" style="bottom: 50%; left: 50%; transform: translateX(-50%) rotate(90deg);"></div>
            
            <!-- Các bông hoa -->
            <div class="flower center" style="top: 20%; left: 50%; transform: translateX(-50%);">🌹</div>
            <div class="flower top-left" style="top: 25%; left: 30%;">🌸</div>
            <div class="flower top-right" style="top: 25%; left: 70%;">🌺</div>
            <div class="flower left" style="top: 40%; left: 20%;">🌷</div>
            <div class="flower right" style="top: 40%; left: 80%;">🌼</div>
            <div class="flower bottom-left" style="top: 55%; left: 25%;">💐</div>
            <div class="flower bottom-right" style="top: 55%; left: 75%;">🌻</div>
        </div>
        
        <div class="photo-frame">
            <img src="https://picsum.photos/seed/mother-love/250/250.jpg" alt="Ảnh mẹ yêu">
        </div>
        
        <div class="final-message">
            Con chúc mẹ luôn xinh đẹp như hoa,<br>
            luôn vui tươi và hạnh phúc!<br>
            Mẹ là người phụ nữ tuyệt vời nhất thế gian!
        </div>
        
        <div class="signature">
            Từ trái tim biết ơn của con ❤️
        </div>
    </div>

    <div class="music-control">
        <button class="music-btn" onclick="toggleMusic()">🎵</button>
    </div>

    <audio id="backgroundMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Tạo tim bay
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * window.innerWidth + 'px';
            heart.style.top = Math.random() * window.innerHeight + 'px';
            heart.style.animationDelay = Math.random() * 2 + 's';
            
            document.getElementById('heartsContainer').appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 4000);
        }

        // Tạo hiệu ứng lấp lánh
        function createSparkle() {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.innerHTML = '✨';
            sparkle.style.left = Math.random() * window.innerWidth + 'px';
            sparkle.style.top = Math.random() * window.innerHeight + 'px';
            sparkle.style.animationDelay = Math.random() * 2 + 's';
            
            document.body.appendChild(sparkle);
            
            setTimeout(() => {
                sparkle.remove();
            }, 2000);
        }

        // Tạo cánh hoa rơi
        function createPetal() {
            const petal = document.createElement('div');
            petal.className = 'petal';
            petal.style.left = Math.random() * window.innerWidth + 'px';
            petal.style.animationDelay = Math.random() * 3 + 's';
            petal.style.animationDuration = (Math.random() * 3 + 5) + 's';
            
            document.body.appendChild(petal);
            
            setTimeout(() => {
                petal.remove();
            }, 8000);
        }

        // Khởi tạo hiệu ứng
        setInterval(createHeart, 1500);
        setInterval(createSparkle, 800);
        setInterval(createPetal, 2000);

        // Hiệu ứng chụm bó hoa
        setTimeout(() => {
            const bouquet = document.getElementById('bouquet');
            bouquet.classList.add('bouquet-gathered');
        }, 6000);

        // Điều khiển nhạc
        let isPlaying = false;
        const audio = document.getElementById('backgroundMusic');

        function toggleMusic() {
            const btn = document.querySelector('.music-btn');
            if (isPlaying) {
                audio.pause();
                btn.innerHTML = '🎵';
            } else {
                audio.play().catch(e => console.log('Không thể phát nhạc tự động'));
                btn.innerHTML = '🔇';
            }
            isPlaying = !isPlaying;
        }

        // Thử phát nhạc khi tải trang
        window.addEventListener('load', () => {
            setTimeout(() => {
                audio.play().catch(e => {
                    console.log('Browser chặn phát nhạc tự động, cần click vào nút nhạc');
                });
            }, 2000);
        });

        // Hiệu ứng chào mừng
        window.addEventListener('load', () => {
            document.body.style.opacity = '0';
            setTimeout(() => {
                document.body.style.transition = 'opacity 2s';
                document.body.style.opacity = '1';
            }, 100);
        });

        // Thêm hiệu ứng click vào hoa
        document.querySelectorAll('.flower').forEach(flower => {
            flower.addEventListener('click', function() {
                this.style.animation = 'none';
                setTimeout(() => {
                    this.style.animation = 'bloomFlower 1s ease-out forwards';
                }, 10);
            });
        });
    </script>
</body>
</html>
