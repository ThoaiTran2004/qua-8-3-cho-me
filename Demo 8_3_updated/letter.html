<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lá Thư 8/3</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Roboto', Arial, sans-serif !important;
            unicode-bidi: embed;
        }
        
        .click-text, .letter-content, .letter-title, .letter-signature {
            font-family: 'Roboto', Arial, sans-serif !important;
            unicode-bidi: embed;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Floating Elements Animation */
        .floating-element {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            animation: floatAcross 8s linear infinite;
        }
        
        @keyframes floatAcross {
            0% {
                transform: translateX(-100px) translateY(0px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateX(calc(100vw + 100px)) translateY(-50px) rotate(360deg);
                opacity: 0;
            }
        }
        
        .floating-element.reverse {
            animation: floatAcrossReverse 10s linear infinite;
            animation-delay: 2s;
        }
        
        @keyframes floatAcrossReverse {
            0% {
                transform: translateX(calc(100vw + 100px)) translateY(0px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateX(-100px) translateY(-30px) rotate(-360deg);
                opacity: 0;
            }
        }
        
        .floating-diagonal {
            animation: floatDiagonal 12s linear infinite;
        }
        
        @keyframes floatDiagonal {
            0% {
                transform: translateX(-50px) translateY(-50px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateX(calc(100vw + 50px)) translateY(calc(100vh + 50px)) rotate(720deg);
                opacity: 0;
            }
        }
        
        .floating-diagonal.reverse {
            animation: floatDiagonalReverse 15s linear infinite;
            animation-delay: 5s;
        }
        
        @keyframes floatDiagonalReverse {
            0% {
                transform: translateX(calc(100vw + 50px)) translateY(-50px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateX(-50px) translateY(calc(100vh + 50px)) rotate(-720deg);
                opacity: 0;
            }
        }
        
        .zigzag-float {
            animation: zigzagFloat 6s ease-in-out infinite;
        }
        
        @keyframes zigzagFloat {
            0%, 100% { 
                transform: translateX(0px) translateY(0px) rotate(0deg); 
                opacity: 0.8;
            }
            25% { 
                transform: translateX(30px) translateY(-20px) rotate(90deg); 
                opacity: 1;
            }
            50% { 
                transform: translateX(-20px) translateY(-40px) rotate(180deg); 
                opacity: 0.9;
            }
            75% { 
                transform: translateX(40px) translateY(-20px) rotate(270deg); 
                opacity: 1;
            }
        }
        
        .wave-float {
            animation: waveFloat 4s ease-in-out infinite;
        }
        
        @keyframes waveFloat {
            0%, 100% { 
                transform: translateX(0px) translateY(0px) scale(1); 
                opacity: 0.7;
            }
            25% { 
                transform: translateX(20px) translateY(-15px) scale(1.1); 
                opacity: 1;
            }
            50% { 
                transform: translateX(-15px) translateY(-25px) scale(0.9); 
                opacity: 0.8;
            }
            75% { 
                transform: translateX(25px) translateY(-10px) scale(1.05); 
                opacity: 1;
            }
        }
        
        /* Music Player Controls - Ultra Compact Design */
        .music-player {
            position: fixed;
            bottom: 15px;
            right: 15px;
            z-index: 10000;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 182, 193, 0.12));
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 3px 10px rgba(255, 105, 180, 0.2),
                0 1px 5px rgba(255, 182, 193, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
            min-width: 120px;
            max-width: 140px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: bottom right;
            animation: musicPlayerFloat 10s ease-in-out infinite;
        }
        
        @keyframes musicPlayerFloat {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-3px) scale(1.005); }
        }
        
        .music-player:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 105, 180, 0.2));
            transform: scale(1.02) translateY(-2px);
            box-shadow: 
                0 6px 20px rgba(255, 105, 180, 0.3),
                0 3px 12px rgba(255, 182, 193, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.35);
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .music-player.playing {
            animation: musicPlayerGlow 4s ease-in-out infinite, musicPlayerFloat 10s ease-in-out infinite;
        }
        
        @keyframes musicPlayerGlow {
            0%, 100% { 
                box-shadow: 
                    0 4px 15px rgba(255, 105, 180, 0.2),
                    0 2px 8px rgba(255, 182, 193, 0.1),
                    inset 0 1px 0 rgba(255, 255, 255, 0.25),
                    0 0 15px rgba(255, 105, 180, 0.25);
            }
            50% { 
                box-shadow: 
                    0 4px 15px rgba(255, 105, 180, 0.3),
                    0 2px 8px rgba(255, 182, 193, 0.2),
                    inset 0 1px 0 rgba(255, 255, 255, 0.35),
                    0 0 25px rgba(255, 105, 180, 0.35);
            }
        }
        
        .music-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .music-title {
            color: white;
            font-size: 9px;
            font-weight: 600;
            opacity: 1;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .music-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 6px;
        }
        
        .music-btn {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.06));
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 12px;
            cursor: pointer;
            padding: 3px;
            border-radius: 50%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
            box-shadow: 
                0 2px 6px rgba(255, 105, 180, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
        
        .music-btn:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.12));
            transform: scale(1.08) translateY(-1px);
            box-shadow: 
                0 3px 8px rgba(255, 105, 180, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.35);
        }
        
        .music-btn:active {
            transform: scale(0.95);
        }
        
        .music-btn.playing {
            background: linear-gradient(135deg, rgba(255, 105, 180, 0.25), rgba(255, 20, 147, 0.18));
            border-color: rgba(255, 105, 180, 0.35);
            animation: musicBtnPulse 3s ease-in-out infinite;
        }
        
        @keyframes musicBtnPulse {
            0%, 100% { 
                transform: scale(1);
                box-shadow: 
                    0 2px 6px rgba(255, 105, 180, 0.25),
                    inset 0 1px 0 rgba(255, 255, 255, 0.3),
                    0 0 12px rgba(255, 105, 180, 0.4);
            }
            50% { 
                transform: scale(1.05);
                box-shadow: 
                    0 3px 8px rgba(255, 105, 180, 0.35),
                    inset 0 1px 0 rgba(255, 255, 255, 0.35),
                    0 0 20px rgba(255, 105, 180, 0.5);
            }
        }
        
        .music-playlist {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 6px;
        }
        
        .music-playlist.show {
            max-height: 140px;
            overflow-y: auto;
            padding-right: 2px;
        }
        
        .music-playlist.show::-webkit-scrollbar {
            width: 2px;
        }
        
        .music-playlist.show::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 1px;
        }
        
        .music-playlist.show::-webkit-scrollbar-thumb {
            background: rgba(255, 105, 180, 0.3);
            border-radius: 1px;
        }
        
        .playlist-toggle {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.06));
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 12px;
            cursor: pointer;
            padding: 3px;
            border-radius: 4px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(6px);
        }
        
        .playlist-toggle:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.12));
            transform: scale(1.05);
        }
        
        .song-item {
            padding: 6px 8px;
            color: white;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 9px;
            opacity: 0.8;
            margin-bottom: 3px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01));
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(3px);
        }
        
        .song-item:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            opacity: 1;
            transform: translateX(2px);
            border-color: rgba(255, 255, 255, 0.15);
        }
        
        .song-item.active {
            background: linear-gradient(135deg, rgba(255, 105, 180, 0.2), rgba(255, 20, 147, 0.12));
            opacity: 1;
            border-color: rgba(255, 105, 180, 0.3);
            transform: translateX(3px);
            box-shadow: 0 2px 6px rgba(255, 105, 180, 0.2);
        }
        
        .music-status {
            color: white;
            font-size: 8px;
            opacity: 0.8;
            text-align: center;
            padding: 4px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.03));
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
        
        .volume-control {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            padding: 6px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.03));
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .volume-slider {
            width: 60px;
            height: 3px;
            -webkit-appearance: none;
            appearance: none;
            background: linear-gradient(90deg, rgba(255, 105, 180, 0.3) 0%, rgba(255, 105, 180, 0.3) var(--value), rgba(255, 255, 255, 0.2) var(--value), rgba(255, 255, 255, 0.2) 100%);
            border-radius: 1.5px;
            outline: none;
            cursor: pointer;
        }
        
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(255, 105, 180, 0.25);
            border: 1px solid white;
            transition: all 0.3s ease;
        }
        
        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            box-shadow: 0 2px 6px rgba(255, 105, 180, 0.4);
        }
        
        .volume-slider::-moz-range-thumb {
            width: 10px;
            height: 10px;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid white;
            box-shadow: 0 1px 4px rgba(255, 105, 180, 0.25);
            transition: all 0.3s ease;
        }
        
        .volume-slider::-moz-range-thumb:hover {
            transform: scale(1.1);
            box-shadow: 0 2px 6px rgba(255, 105, 180, 0.4);
        }
    </style>
</head>
<body>
    <div class="floating-hearts" id="heartsContainer"></div>
    <div class="decorative-elements" id="decorativeContainer"></div>
    
    <!-- Floating Elements -->
    <div class="floating-element" style="top: 8%; font-size: 26px;">🌸</div>
    <div class="floating-element reverse" style="top: 18%; font-size: 22px;">🌺</div>
    <div class="floating-diagonal" style="top: 10%; font-size: 20px;">💐</div>
    <div class="floating-diagonal reverse" style="top: 14%; font-size: 24px;">🌹</div>
    <div class="floating-element" style="top: 28%; font-size: 18px;">🌷</div>
    <div class="floating-element reverse" style="top: 20%; font-size: 21px;">🌼</div>
    
    <div class="zigzag-float" style="top: 22%; left: 12%; font-size: 20px;">❤️</div>
    <div class="wave-float" style="top: 32%; left: 68%; font-size: 16px;">💕</div>
    <div class="zigzag-float" style="top: 38%; left: 38%; font-size: 18px;">💖</div>
    <div class="wave-float" style="top: 12%; left: 78%; font-size: 14px;">💗</div>
    
    <div class="floating-element" style="top: 48%; font-size: 17px;">🌵</div>
    <div class="floating-element reverse" style="top: 42%; font-size: 19px;">🌿</div>
    <div class="floating-diagonal" style="top: 52%; font-size: 15px;">🍀</div>
    <div class="floating-diagonal reverse" style="top: 58%; font-size: 21px;">🌱</div>
    
    <div class="container">
        <div class="envelope-container" id="envelopeContainer">
            <div class="envelope" id="envelope">
                <div class="heart-center">❤️</div>
                <div class="flower-decoration">🌸</div>
            </div>
        </div>
        
        <div class="letter-container" id="letterContainer">
            <div class="letter" id="letter">
                
            </div>
            <div class="click-text">Click vào đây</div>
        </div>
    </div>
    
    <!-- Audio Element -->
    <audio id="bgMusic" loop></audio>
    
    <!-- Auto-play audio element for sync -->
    <audio id="autoPlayAudio" src="music/Thanh Tan.mp3" loop style="display: none;" volume="0.3"></audio>
    
    <!-- Hidden iframe for continuous audio -->
    <iframe id="audioFrame" style="display: none; width: 0; height: 0; border: none;"></iframe>

    <script src="js/script.js"></script>
</body>
</html>
