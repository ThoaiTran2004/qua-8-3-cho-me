<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quà Tặng 8/3</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Roboto', Arial, sans-serif !important;
            unicode-bidi: embed;
        }
        
        .loading-text {
            font-family: 'Roboto', Arial, sans-serif !important;
            unicode-bidi: embed;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            animation: textFloat 3s ease-in-out infinite;
        }
        
        @keyframes textFloat {
            0%, 100% { transform: translateY(0px) translateX(0px); }
            25% { transform: translateY(-10px) translateX(5px); }
            50% { transform: translateY(-5px) translateX(-5px); }
            75% { transform: translateY(-15px) translateX(3px); }
        }
        
        /* Floating Elements Animation */
        .floating-element {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            animation: floatAcross 8s linear infinite;
        }
        
        @keyframes floatAcross {
            0% {
                transform: translateX(-100px) translateY(0px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateX(calc(100vw + 100px)) translateY(-50px) rotate(360deg);
                opacity: 0;
            }
        }
        
        .floating-element.reverse {
            animation: floatAcrossReverse 10s linear infinite;
            animation-delay: 2s;
        }
        
        @keyframes floatAcrossReverse {
            0% {
                transform: translateX(calc(100vw + 100px)) translateY(0px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateX(-100px) translateY(-30px) rotate(-360deg);
                opacity: 0;
            }
        }
        
        .floating-diagonal {
            animation: floatDiagonal 12s linear infinite;
        }
        
        @keyframes floatDiagonal {
            0% {
                transform: translateX(-50px) translateY(-50px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateX(calc(100vw + 50px)) translateY(calc(100vh + 50px)) rotate(720deg);
                opacity: 0;
            }
        }
        
        .floating-diagonal.reverse {
            animation: floatDiagonalReverse 15s linear infinite;
            animation-delay: 5s;
        }
        
        @keyframes floatDiagonalReverse {
            0% {
                transform: translateX(calc(100vw + 50px)) translateY(-50px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateX(-50px) translateY(calc(100vh + 50px)) rotate(-720deg);
                opacity: 0;
            }
        }
        
        .zigzag-float {
            animation: zigzagFloat 6s ease-in-out infinite;
        }
        
        @keyframes zigzagFloat {
            0%, 100% { 
                transform: translateX(0px) translateY(0px) rotate(0deg); 
                opacity: 0.8;
            }
            25% { 
                transform: translateX(30px) translateY(-20px) rotate(90deg); 
                opacity: 1;
            }
            50% { 
                transform: translateX(-20px) translateY(-40px) rotate(180deg); 
                opacity: 0.9;
            }
            75% { 
                transform: translateX(40px) translateY(-20px) rotate(270deg); 
                opacity: 1;
            }
        }
        
        .wave-float {
            animation: waveFloat 4s ease-in-out infinite;
        }
        
        @keyframes waveFloat {
            0%, 100% { 
                transform: translateX(0px) translateY(0px) scale(1); 
                opacity: 0.7;
            }
            25% { 
                transform: translateX(20px) translateY(-15px) scale(1.1); 
                opacity: 1;
            }
            50% { 
                transform: translateX(-15px) translateY(-25px) scale(0.9); 
                opacity: 0.8;
            }
            75% { 
                transform: translateX(25px) translateY(-10px) scale(1.05); 
                opacity: 1;
            }
        }
        
        /* Music Player Controls - Ultra Compact Design */
        .music-player {
            position: fixed;
            bottom: 15px;
            right: 15px;
            z-index: 10000;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 182, 193, 0.12));
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 3px 10px rgba(255, 105, 180, 0.2),
                0 1px 5px rgba(255, 182, 193, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
            min-width: 120px;
            max-width: 140px;
            transition: all 0.2s ease;
            transform-origin: bottom right;
        }
        
        .music-player:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 105, 180, 0.2));
            transform: scale(1.01) translateY(-1px);
            box-shadow: 
                0 6px 20px rgba(255, 105, 180, 0.3),
                0 3px 12px rgba(255, 182, 193, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.35);
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .music-player.playing {
            animation: musicPlayerGlow 6s ease-in-out infinite;
        }
        
        @keyframes musicPlayerGlow {
            0%, 100% { 
                box-shadow: 
                    0 4px 15px rgba(255, 105, 180, 0.2),
                    0 2px 8px rgba(255, 182, 193, 0.1),
                    inset 0 1px 0 rgba(255, 255, 255, 0.25);
            }
            50% { 
                box-shadow: 
                    0 4px 15px rgba(255, 105, 180, 0.3),
                    0 2px 8px rgba(255, 182, 193, 0.2),
                    inset 0 1px 0 rgba(255, 255, 255, 0.35);
            }
        }
        
        .music-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
            padding-bottom: 2px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .music-title {
            color: white;
            font-size: 9px;
            font-weight: 600;
            opacity: 1;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .music-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            margin-bottom: 4px;
        }
        
        .music-btn {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.06));
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 12px;
            cursor: pointer;
            padding: 3px;
            border-radius: 50%;
            transition: all 0.2s ease;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
            box-shadow: 
                0 2px 4px rgba(255, 105, 180, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
        
        .music-btn:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.12));
            transform: scale(1.05);
            box-shadow: 
                0 3px 8px rgba(255, 105, 180, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.35);
        }
        
        .music-btn:active {
            transform: scale(0.95);
        }
        
        .music-btn.playing {
            background: linear-gradient(135deg, rgba(255, 105, 180, 0.25), rgba(255, 20, 147, 0.18));
            border-color: rgba(255, 105, 180, 0.35);
            animation: musicBtnPulse 4s ease-in-out infinite;
        }
        
        @keyframes musicBtnPulse {
            0%, 100% { 
                transform: scale(1);
                box-shadow: 
                    0 2px 6px rgba(255, 105, 180, 0.25),
                    inset 0 1px 0 rgba(255, 255, 255, 0.3);
            }
            50% { 
                transform: scale(1.03);
                box-shadow: 
                    0 3px 8px rgba(255, 105, 180, 0.35),
                    inset 0 1px 0 rgba(255, 255, 255, 0.35);
            }
        }
        
        .music-playlist {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.2s ease;
            margin-bottom: 6px;
        }
        
        .music-playlist.show {
            max-height: 140px;
            overflow-y: auto;
            padding-right: 2px;
        }
        
        .music-playlist.show::-webkit-scrollbar {
            width: 2px;
        }
        
        .music-playlist.show::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 1px;
        }
        
        .music-playlist.show::-webkit-scrollbar-thumb {
            background: rgba(255, 105, 180, 0.3);
            border-radius: 1px;
        }
        
        .playlist-toggle {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.06));
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 12px;
            cursor: pointer;
            padding: 3px;
            border-radius: 4px;
            transition: all 0.2s ease;
            backdrop-filter: blur(6px);
        }
        
        .playlist-toggle:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.12));
            transform: scale(1.05);
        }
        
        .song-item {
            padding: 6px 8px;
            color: white;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
            font-size: 9px;
            opacity: 0.8;
            margin-bottom: 3px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01));
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(3px);
        }
        
        .song-item:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            opacity: 1;
            transform: translateX(2px);
            border-color: rgba(255, 255, 255, 0.15);
        }
        
        .song-item.active {
            background: linear-gradient(135deg, rgba(255, 105, 180, 0.2), rgba(255, 20, 147, 0.12));
            opacity: 1;
            border-color: rgba(255, 105, 180, 0.3);
            transform: translateX(3px);
            box-shadow: 0 2px 6px rgba(255, 105, 180, 0.2);
        }
        
        .music-status {
            color: white;
            font-size: 8px;
            opacity: 0.8;
            text-align: center;
            padding: 4px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.03));
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
        
        .volume-control {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            padding: 6px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.03));
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .volume-slider {
            width: 60px;
            height: 3px;
            -webkit-appearance: none;
            appearance: none;
            background: linear-gradient(90deg, rgba(255, 105, 180, 0.3) 0%, rgba(255, 105, 180, 0.3) var(--value), rgba(255, 255, 255, 0.2) var(--value), rgba(255, 255, 255, 0.2) 100%);
            border-radius: 1.5px;
            outline: none;
            cursor: pointer;
        }
        
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(255, 105, 180, 0.25);
            border: 1px solid white;
            transition: all 0.2s ease;
        }
        
        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            box-shadow: 0 2px 6px rgba(255, 105, 180, 0.4);
        }
        
        .volume-slider::-moz-range-thumb {
            width: 10px;
            height: 10px;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid white;
            box-shadow: 0 1px 4px rgba(255, 105, 180, 0.25);
            transition: all 0.2s ease;
        }
        
        .volume-slider::-moz-range-thumb:hover {
            transform: scale(1.1);
            box-shadow: 0 2px 6px rgba(255, 105, 180, 0.4);
        }
        
        /* Container and Envelope Styles */
        .container {
            text-align: center;
            z-index: 10;
            position: relative;
        }
        
        .envelope-container {
            display: inline-block;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .envelope {
            width: 200px;
            height: 140px;
            background: linear-gradient(135deg, #fff5f5, #ffe0e0);
            border: 2px solid #ff69b4;
            border-radius: 10px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.3);
            transition: all 0.3s ease;
        }
        
        .envelope:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 105, 180, 0.4);
            border-color: #ff1493;
        }
        
        .heart-center {
            font-size: 24px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .flower-decoration {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 16px;
        }
        
        .letter-container {
            margin-top: 20px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .letter {
            width: 180px;
            height: 120px;
            background: white;
            border: 1px solid #ff69b4;
            border-radius: 5px;
            padding: 10px;
            margin: 0 auto;
            box-shadow: 0 3px 10px rgba(255, 105, 180, 0.2);
        }
        
        .click-text {
            color: white;
            font-size: 14px;
            margin-top: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div class="sparkle-bg" id="sparkleContainer"></div>
    
    <!-- Floating Elements -->
    <div class="floating-element" style="top: 10%; font-size: 30px;">🌸</div>
    <div class="floating-element reverse" style="top: 20%; font-size: 25px;">🌺</div>
    <div class="floating-diagonal" style="top: 5%; font-size: 20px;">💐</div>
    <div class="floating-diagonal reverse" style="top: 15%; font-size: 28px;">🌹</div>
    <div class="floating-element" style="top: 30%; font-size: 22px;">🌷</div>
    <div class="floating-element reverse" style="top: 8%; font-size: 26px;">🌼</div>
    
    <div class="zigzag-float" style="top: 25%; left: 20%; font-size: 24px;">❤️</div>
    <div class="wave-float" style="top: 35%; left: 70%; font-size: 20px;">💕</div>
    <div class="zigzag-float" style="top: 40%; left: 40%; font-size: 22px;">💖</div>
    <div class="wave-float" style="top: 15%; left: 80%; font-size: 18px;">💗</div>
    
    <div class="floating-element" style="top: 50%; font-size: 21px;">🌵</div>
    <div class="floating-element reverse" style="top: 45%; font-size: 23px;">🌿</div>
    <div class="floating-diagonal" style="top: 55%; font-size: 19px;">🍀</div>
    <div class="floating-diagonal reverse" style="top: 60%; font-size: 25px;">🌱</div>
    
    <div class="loading">
        <div class="heart">❤️</div>
        <div class="loading-text">Đang chuẩn bị món quà...</div>
    </div>
    
    <!-- Container -->
    <div class="container">
        <div class="envelope-container" id="envelopeContainer">
            <div class="envelope" id="envelope" onclick="goToLetterPage()" style="cursor: pointer;">
                <div class="heart-center">❤️</div>
                <div class="flower-decoration">🌸</div>
            </div>
        </div>
        
        <div class="letter-container" id="letterContainer">
            <div class="click-text">Click vào đây</div>
        </div>
    </div>
    
    <!-- Auto-play trigger overlay -->
    <div id="autoplayTrigger" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 99999; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <div style="text-align: center; color: white;">
            <div style="font-size: 24px; margin-bottom: 20px;">🎵</div>
            <div style="font-size: 18px; margin-bottom: 10px;">Nhấp để bắt đầu trải nghiệm</div>
            <div style="font-size: 14px; opacity: 0.7;">Nhạc Thanh Tân sẽ tự động phát</div>
        </div>
    </div>
    
    <!-- Hidden Audio Element for continuous music -->
    <audio id="bgMusic" loop style="display: none;"></audio>
    
    <!-- Auto-play audio element -->
    <audio id="autoPlayAudio" src="music/Thanh Tan.mp3" loop style="display: none;" volume="0.3"></audio>
    
    <!-- Hidden button for auto-click -->
    <button id="hiddenPlayBtn" style="position: absolute; left: -9999px; top: -9999px; opacity: 0; pointer-events: none;">Play</button>
    
    <!-- Hidden iframe for continuous audio -->
    <iframe id="audioFrame" style="display: none; width: 0; height: 0; border: none;"></iframe>
    
    <script>
        // Chuyển thẳng đến trang lá thư
        window.location.href = 'letter.html';
    </script>
</body>
</html>
